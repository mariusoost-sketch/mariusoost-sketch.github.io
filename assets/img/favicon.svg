<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CUSiP">
  <rect width="64" height="64" rx="14" fill="#0B2447"/>
  <!-- CUSiP wordmark: small lowered i between S and P -->
  <text x="7" y="36" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="1.4">CUS</text>
  <text x="40.2" y="43" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="8" fill="#3ee0d0">i</text>
  <text x="45.2" y="36" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#ffffff">P</text>
</svg>
